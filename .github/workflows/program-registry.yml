name: Program registry integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate registry
        run: python tools/validate_program.py
      - name: Test validator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Prompt 005 receipts
        run: |
          python tools/validate_value_receipt.py \
            program/evidence/prompt-005/context-value-receipt.json
          python tools/validate_value_receipt.py \
            program/evidence/prompt-005/decision-value-receipt.json
      - name: Check generated dashboard
        run: python tools/render_program_status.py --check
